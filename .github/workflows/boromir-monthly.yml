name: Boromir Monthly Top Tags

on:
  workflow_dispatch:         # triggered by cron-job.org, monthly

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Boromir Monthly Tags
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          PERF_SHEET_ID: ${{ secrets.PERF_SHEET_ID }}
        run: python boromir.py --monthly-tags
